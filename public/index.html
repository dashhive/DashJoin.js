<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Wallet - Digital Cash</title>
		<link rel="stylesheet" href="./mvp.css" />
		<script src="./node_modules/dashphrase/dashphrase.js"></script>
		<script src="./node_modules/@dashincubator/secp256k1/secp256k1.js"></script>
		<script src="./node_modules/dashkeys/dashkeys.js"></script>
		<script src="./node_modules/dashhd/dashhd.js"></script>
		<style>

				padding-bottom: 0.3rem;

			header nav img {

			main {
				padding-top: 0;
			}
			form {
				width: 100%;
				box-sizing: border-box;
			}
			hr,
			footer hr {
				margin-top: 1.2rem;
				margin-bottom: 1.2rem;
			}
			footer {
				padding: 1rem;
			}
			pre {
				margin: 0;
				padding: 0;
			}
			pre code,
			code {
				margin: 0;
				padding: 0.3rem 1rem 0.3rem 1rem;
			}
		</style>

	<body hidden="hidden">
		<header>
			<nav>
				<a href="./"
					><img
						alt="Digital Cash . dev"
						src="https://github.com/user-attachments/assets/08cdbc66-58d7-4cc4-8cc2-a246b28cb0e2"
						height="96"
				/></a>
				<h1>Digital Cash Wallet</h1>
				<ul>
					<li data-network="testnet" hidden>
						<a
							href="http://faucet.test.dash.crowdnode.io/"
							target="_blank"
							title="CrowdNode Faucet"
							>CN 💸</a
						>
					</li>
					<li data-network="testnet" hidden>
						<a
							href="http://faucet.testnet.networks.dash.org"
							target="_blank"
							title="Dash Core Group Faucet"
							>DCG 💸</a
						>
					</li>
					<li>
						<a
							href="https://github.com/digitalcashdev/rpcproxy/issues"
							target="_blank"
							title="Git Issues"
							>Bugs 🐛</a
						>
					</li>
					<li>
						<a
							href="https://github.com/digitalcashdev/rpcproxy"
							target="_blank"
							title="Git Source"
							>Git 📦</a
						>
					</li>
				</ul>
			</nav>
		</header>
		<main>
			<section>
				<form id="wallet-form">
					<label
						>Wallet Phrase
						<small>12-word seed</small>
						<input
							type="text"
							data-id="wallet-phrase"
							placeholder="ex: zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo wrong"
						/>
					</label>
					<label
						>Phrase Salt
						<small>for advanced users only</small>
						<input
							type="text"
							data-id="phrase-salt"
							placeholder="ex: TREZOR"
							value=""
							disabled
						/>
					</label>
					<label
						>Wallet Seed <small>pbkdf2 bytes</small>
						<br />
						<pre><code
                        data-id="wallet-seed">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</code></pre>
					</label>
					<label
						>First Account
						<small>bip-44 path</small>
						<input
							type="text"
							data-id="wallet-account"
							placeholder="ex: m/44'/5'/0'"
							disabled
						/>
					</label>
					<details>
						<summary>
							Spent Addresses
							<small>addresses with utxos</small>
						</summary>
						<pre><code
                        data-id="spent">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</code></pre>
					</details>
					<label
						>Balances
						<small>addresses with utxos</small>
						<pre><code
                        data-id="balances">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</code></pre>
					</label>
					<label
						>Fresh Addresses
						<small>base58check-encoded pkh</small>
						<pre><code
                        data-id="addresses">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</code></pre>
					</label>

					<button type="submit">Try it!</button>
				</form>
			</section>
			<br />
			<section>
				<form>
					<label
						>Output
						<pre><code data-id="output">N/A</code></pre>
					</label>
				</form>
			</section>
			<footer>
				<hr />
				<p>
					© Dash Incubator
					<a href="https://github.com/dashhive/" target="_blank"
						>github.com/dashhive/</a
					><br />
				</p>
			</footer>
		</main>

		<script>
			'use strict';

			let network = 'testnet';
			let rpcBaseUrl = 'https://trpc.digitalcash.dev/';
			let rpcBasicAuth = btoa(`api:null`);

			function $(sel, el) {
				return (el || document).querySelector(sel);
			}

			function $$(sel, el) {
				return Array.from((el || document).querySelectorAll(sel));
			}

			async function rpc(method, ...params) {
				// typically http://localhost:19998/
				let payload = JSON.stringify({ method, params });
				let resp = await fetch(rpcBaseUrl, {
					method: 'POST',
					headers: {
						Authorization: `Basic ${rpcBasicAuth}`,
						'Content-Type': 'application/json',
					},
					body: payload,
				});

				let data = await resp.json();
				if (data.error) {
					let err = new Error(data.error.message);
					Object.assign(err, data.error);
					throw err;
				}

				return data.result;
			}

			function dbGet(key, defVal) {
				let dataJson = localStorage.getItem(key);
				if (!dataJson) {
					dataJson = JSON.stringify(defVal);
				}

				let data;
				try {
					data = JSON.parse(dataJson);
				} catch (e) {
					data = defVal;
				}
				return data;
			}

			function dbSet(key, val) {
				if (val === null) {
					localStorage.removeItem(key);
					return;
				}

				let dataJson = JSON.stringify(val);
				localStorage.setItem(key, dataJson);
			}

			function removeElement(arr, val) {
				let index = arr.indexOf(val);
				if (index !== -1) {
					arr.splice(index, 1);
				}
			}

			async function init() {
				let phrases = dbGet('wallet-phrases', []);
				let primaryPhrase = phrases[0];
				if (!primaryPhrase) {
					primaryPhrase = await DashPhrase.generate(128);
					dbSet('wallet-phrases', [primaryPhrase]);
				}

				let primarySalt = '';
				let primarySeedBytes = await DashPhrase.toSeed(
					primaryPhrase,
					primarySalt,
				);
				let primarySeedHex = DashKeys.utils.bytesToHex(primarySeedBytes);
				$('[data-id=wallet-phrase]').value = primaryPhrase;
				$('[data-id=wallet-seed]').innerText = primarySeedHex;

				let accountIndex = 0;
				let coinType = 5; // DASH
				let versions = DashHd.MAINNET;
				if (network === `testnet`) {
					coinType = 1; // testnet (for all coins)
					versions = DashHd.TESTNET;
				}
				$('[data-id=wallet-account]').value =
					`m/44'/${coinType}'/${accountIndex}'`;

				let walletId;
				let xprvKey;
				let usage = DashHd.RECEIVE;
				{
					let walletKey = await DashHd.fromSeed(primarySeedBytes);
					walletId = await DashHd.toId(walletKey);

					let accountKey = await walletKey.deriveAccount(0, {
						purpose: 44, // BIP-44 (default)
						coinType: coinType,
						versions: versions,
					});
					xprvKey = await accountKey.deriveXKey(usage);
				}

				let keys = [];
				let previousIndex = 0;
				let last = previousIndex + 50;
				for (let i = previousIndex; i < last; i += 1) {
					let key;
					try {
						key = await xprvKey.deriveAddress(i); // xprvKey from step 2
					} catch (e) {
						// to make up for skipping on error
						last += 1;
						continue;
					}

					let wif = await DashHd.toWif(key.privateKey, { version: 'testnet' });
					let address = await DashHd.toAddr(key.publicKey, {
						version: 'testnet',
					});
					let hdpath = `m/44'/${coinType}'/${accountIndex}'/${usage}`; // accountIndex from step 2
					keys.push({
						walletId: walletId,
						index: i,
						hdpath: hdpath, // useful for multi-account indexing
						address: address, // XrZJJfEKRNobcuwWKTD3bDu8ou7XSWPbc9
						wif: wif, // XCGKuZcKDjNhx8DaNKK4xwMMNzspaoToT6CafJAbBfQTi57buhLK
						key: key,
					});
				}

				{
					let deltasMap = {};
					let addresses = [];
					let spent = [];
					for (let key of keys) {
						let info = dbGet(key.address);
						let isSpent = info && info.deltas?.length && !info.balance;
						if (isSpent) {
							spent.push(info.address);
							removeElement(addresses, info.address);
							continue; // used address (only check on manual sync)
						}
						addresses.push(key.address);
					}
					let deltaLists = await Promise.all([
						// See
						// - <https://trpc.digitalcash.dev/#?method=getaddressdeltas&params=[{"addresses":["ybLxVb3aspSHFgxM1qTyuBSXnjAqLFEG8P"]}]&submit>
						// - <https://trpc.digitalcash.dev/#?method=getaddressmempool&params=[{"addresses":["ybLxVb3aspSHFgxM1qTyuBSXnjAqLFEG8P"]}]&submit>
						await rpc('getaddressdeltas', { addresses }),
						// TODO check for proof of instantsend / acceptance
						await rpc('getaddressmempool', { addresses }),
					]);
					for (let deltaList of deltaLists) {
						for (let delta of deltaList) {
							console.log('DEBUG delta', delta);
							removeElement(addresses, delta.address);
							if (!deltasMap[delta.address]) {
								deltasMap[delta.address] = { balance: 0, deltas: [] };
							}
							deltasMap[delta.address].deltas.push(delta);
							deltasMap[delta.address].balance += delta.satoshis;
						}
					}

					let balances = [];
					let addrs = Object.keys(deltasMap);
					for (let addr of addrs) {
						let info = deltasMap[addr];
						console.log('DEBUG delta info', info);
						dbSet(addr, info);
						if (info.balance === 0) {
							continue;
						}

						const SATS = 100000000;
						let amount = info.balance / SATS;
						let amountStr = amount.toFixed(8);
						balances.push(`${addr}: ${info.deltas.length}: ${amountStr}`);
					}

					$('[data-id=balances]').innerText = balances.join('\n');
					$('[data-id=addresses]').innerText = addresses.join('\n');
				}
			}

			async function main() {
				await init();

				if (network === `testnet`) {
					let $testnets = $$('[data-network=testnet]');
					for (let $testnet of $testnets) {
						$testnet.removeAttribute('hidden');
					}
				}

				$('body').removeAttribute('hidden');
			}

			main().catch(function (err) {
				console.error(`Error in main:`, err);
			});
		</script>
	</body>
</html>
